services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-stock-trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_trader}
      POSTGRES_USER: ${POSTGRES_USER:-stock_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_trader} -d ${POSTGRES_DB:-stock_trader}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
