name: KRX session monitor safety

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/lib/exchange-session-monitor.ps1'
      - 'scripts/lib/market-session-scheduler.ps1'
      - 'scripts/test-paper-websocket-monitor.ps1'
      - 'scripts/tests/exchange-session-monitor.Tests.ps1'
      - '.github/workflows/krx-session-monitor-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  krx-monitor-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check monitor syntax and focused session tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'3.4.0' } | Select-Object -First 1
          if ($null -eq $pester) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force

          foreach ($path in @(
            'scripts/lib/exchange-session-monitor.ps1',
            'scripts/lib/market-session-scheduler.ps1',
            'scripts/test-paper-websocket-monitor.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $path." }
          }

          $result = Invoke-Pester -Path 'scripts/tests/exchange-session-monitor.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -ne 29) {
            throw "KRX session monitor tests failed: passed=$($result.PassedCount), failed=$($result.FailedCount)."
          }
