name: KRX session monitor safety

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/lib/exchange-session-monitor.ps1'
      - 'scripts/lib/market-session-scheduler.ps1'
      - 'scripts/paper-session-monitor-status.ps1'
      - 'scripts/test-paper-websocket-monitor.ps1'
      - 'scripts/lib/safe-http-diagnostic.ps1'
      - 'scripts/test-paper-kis-python.ps1'
      - 'scripts/tests/exchange-session-monitor.Tests.ps1'
      - 'scripts/tests/paper-session-monitor-status.Tests.ps1'
      - 'scripts/tests/krx-session-monitor-domestic.Tests.ps1'
      - 'scripts/tests/local-stack-restart-domestic.Tests.ps1'
      - 'scripts/run-local-stack-task.ps1'
      - 'scripts/test-local-stack-env-reload.ps1'
      - 'scripts/lib/local-stack-activation.ps1'
      - 'scripts/tests/safe-http-diagnostic.Tests.ps1'
      - 'scripts/restart-local-stack-task.ps1'
      - '.github/workflows/krx-session-monitor-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  krx-monitor-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check domestic PowerShell safety scripts and focused tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'3.4.0' } | Select-Object -First 1
          if ($null -eq $pester) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force

          foreach ($path in @(
            'scripts/lib/exchange-session-monitor.ps1',
            'scripts/lib/market-session-scheduler.ps1',
            'scripts/paper-session-monitor-status.ps1',
            'scripts/test-paper-websocket-monitor.ps1',
            'scripts/lib/safe-http-diagnostic.ps1',
            'scripts/test-paper-kis-python.ps1',
            'scripts/restart-local-stack-task.ps1'
            'scripts/run-local-stack-task.ps1',
            'scripts/test-local-stack-env-reload.ps1',
            'scripts/lib/local-stack-activation.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $path." }
          }

          $result = Invoke-Pester -Path 'scripts/tests/krx-session-monitor-domestic.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -ne 4) {
            throw "Domestic KRX session monitor tests failed: passed=$($result.PassedCount), failed=$($result.FailedCount)."
          }

          $continuityResult = Invoke-Pester -Path 'scripts/tests/exchange-session-monitor.Tests.ps1' -TestName 'Domestic full-session feed continuity gate' -PassThru
          if ($continuityResult.FailedCount -gt 0 -or $continuityResult.PassedCount -ne 1) {
            throw "Domestic full-session continuity test failed: passed=$($continuityResult.PassedCount), failed=$($continuityResult.FailedCount)."
          }

          $reconnectResult = Invoke-Pester -Path 'scripts/tests/paper-session-monitor-status.Tests.ps1' -TestName 'Domestic PAPER monitor reconnect tolerance' -PassThru
          if ($reconnectResult.FailedCount -gt 0 -or $reconnectResult.PassedCount -ne 2) {
            throw "Domestic PAPER reconnect tolerance tests failed: passed=$($reconnectResult.PassedCount), failed=$($reconnectResult.FailedCount)."
          }

          $restartResult = Invoke-Pester -Path 'scripts/tests/local-stack-restart-domestic.Tests.ps1' -PassThru
          if ($restartResult.FailedCount -gt 0 -or $restartResult.PassedCount -ne 4) {
            throw "Domestic local stack restart tests failed: passed=$($restartResult.PassedCount), failed=$($restartResult.FailedCount)."
          }

          & 'scripts/test-local-stack-env-reload.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Domestic operational-scope environment reload test failed.' }

          $diagnosticResult = Invoke-Pester -Path 'scripts/tests/safe-http-diagnostic.Tests.ps1' -PassThru
          if ($diagnosticResult.FailedCount -gt 0 -or $diagnosticResult.PassedCount -ne 3) {
            throw "Domestic KIS smoke diagnostic tests failed: passed=$($diagnosticResult.PassedCount), failed=$($diagnosticResult.FailedCount)."
          }
