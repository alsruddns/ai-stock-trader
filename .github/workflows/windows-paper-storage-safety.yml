name: Windows PAPER storage recovery safety

on:
  push:
    branches: [develop]
    paths:
      - 'services/market-ai/app/bar_write_outbox.py'
      - 'services/market-ai/app/paper_runtime.py'
      - 'services/market-ai/tests/test_bar_write_outbox.py'
      - 'services/market-ai/tests/test_paper_runtime.py'
      - 'services/market-ai/tests/test_bar_storage_postgres_integration.py'
      - '.github/workflows/windows-paper-storage-safety.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/market-ai/app/bar_write_outbox.py'
      - 'services/market-ai/app/paper_runtime.py'
      - 'services/market-ai/tests/test_bar_write_outbox.py'
      - 'services/market-ai/tests/test_paper_runtime.py'
      - 'services/market-ai/tests/test_bar_storage_postgres_integration.py'
      - '.github/workflows/windows-paper-storage-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-paper-storage-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      PAPER_AUTOTRADING_ENABLED: "false"
      KIS_PAPER_ORDERS_ENABLED: "false"
      KIS_REAL_ORDERS_ENABLED: "false"
      KIS_ACCOUNT_READ_ENABLED: "false"
      KIS_PAPER_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ACCOUNT_READ_ENABLED: "false"
      MARKET_OPERATIONAL_SCOPE: KR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/market-ai/pyproject.toml
      - name: Install storage recovery test dependencies
        working-directory: services/market-ai
        run: python -m pip install -e ".[dev,ops]"
      - name: Verify abrupt writer termination preserves the Windows SQLite WAL outbox
        working-directory: services/market-ai
        run: python -m pytest -q tests/test_bar_write_outbox.py
      - name: Verify outbox recovery blocks PAPER automation until PostgreSQL acknowledgement
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_paper_runtime.py::test_durable_bar_outbox_restores_and_drains_before_automation_can_resume
          tests/test_paper_runtime.py::test_startup_keeps_paper_automation_blocked_while_durable_outbox_recovers
          tests/test_paper_runtime.py::test_bar_storage_retries_idempotent_upsert_when_outbox_acknowledgement_fails
          tests/test_paper_runtime.py::test_bar_storage_keeps_durable_outbox_pending_when_acknowledgement_stays_unavailable

  postgres-bar-storage-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_stock_trader_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_stock_trader_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_LOCAL_POSTGRES_INTEGRATION_TESTS: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_stock_trader_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KIS_PAPER_ORDERS_ENABLED: "false"
      KIS_REAL_ORDERS_ENABLED: "false"
      KIS_ACCOUNT_READ_ENABLED: "false"
      KIS_PAPER_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ACCOUNT_READ_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/market-ai/pyproject.toml
      - name: Install PostgreSQL recovery test dependencies
        working-directory: services/market-ai
        run: python -m pip install -e ".[dev,ops]"
      - name: Verify real PostgreSQL outage recovery across runtime restart
        working-directory: services/market-ai
        run: python -m pytest -q tests/test_bar_storage_postgres_integration.py
