name: Windows PAPER preflight checks

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'scripts/**/*.ps1'
      - 'scripts/**/*.py'
      - 'scripts/tests/**/*.ps1'
      - '.github/workflows/windows-paper-preflight.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/**/*.ps1'
      - 'scripts/**/*.py'
      - 'scripts/tests/**/*.ps1'
      - '.github/workflows/windows-paper-preflight.yml'

jobs:
  paper-order-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check PowerShell syntax and PAPER preflight rules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'3.4.0' } | Select-Object -First 1
          if ($null -eq $pester) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force

          $scriptFiles = @(
            'scripts/test-kis-paper-order-lifecycle.ps1',
            'scripts/test-kis-paper-order-lifecycle-isolated.ps1',
            'scripts/run-us-paper-lifecycle-smoke.ps1',
            'scripts/lib/kis-paper-order-preflight.ps1',
            'scripts/lib/kis-paper-order-lifecycle.ps1',
            'scripts/lib/us-paper-lifecycle-smoke.ps1',
            'scripts/lib/lean-cost-inputs.ps1',
            'scripts/lib/tracked-credential-scan.ps1',
            'scripts/test-tracked-credentials.ps1',
            'scripts/lib/retired-kis-analysis-scan.ps1',
            'scripts/test-retired-kis-analysis.ps1',
            'scripts/test-paper-websocket-monitor.ps1',
            'scripts/lib/exchange-session-monitor.ps1',
            'scripts/lib/market-session-scheduler.ps1',
            'scripts/register-market-data-session-monitor.ps1',
            'scripts/register-market-data-session-horizon.ps1',
            'scripts/update-market-data-session-monitor-duration.ps1',
            'scripts/enable-local-automation-task-wake.ps1',
            'scripts/lib/paper-safety.ps1',
            'scripts/lib/local-postgres-binding.ps1',
            'scripts/run-local-stack-task.ps1',
            'scripts/run-model-retraining.ps1',
            'scripts/run-model-holdout-evaluation.ps1',
            'scripts/register-model-candidate-retraining-task.ps1',
            'scripts/register-model-holdout-evaluation-task.ps1',
            'scripts/lib/model-holdout-date-gate.ps1',
            'scripts/lib/model-retraining-report.ps1',
            'scripts/lib/operations-report.ps1',
            'scripts/export-daily-report.ps1',
            'scripts/lib/dashboard-task.ps1',
            'scripts/run-dashboard-task.ps1',
            'scripts/install-dashboard-task.ps1',
            'scripts/remove-dashboard-task.ps1'
          )
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptFile), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$scriptFile`: $($_.Message)" }
            }
          }

          $domesticScopeResult = Invoke-Pester -Path 'scripts/tests/domestic-only-validation.Tests.ps1' -PassThru
          if ($domesticScopeResult.FailedCount -gt 0 -or $domesticScopeResult.PassedCount -ne 8) {
            throw "Domestic-only operational scope tests failed: passed=$($domesticScopeResult.PassedCount), failed=$($domesticScopeResult.FailedCount)."
          }

          $paperPreflightResult = Invoke-Pester -Path 'scripts/tests/kis-paper-order-preflight.Tests.ps1' -PassThru
          if ($paperPreflightResult.FailedCount -gt 0 -or $paperPreflightResult.PassedCount -ne 43) {
            throw "KIS PAPER preflight tests failed: passed=$($paperPreflightResult.PassedCount), failed=$($paperPreflightResult.FailedCount)."
          }

          $holdoutDateResult = Invoke-Pester -Path 'scripts/tests/model-holdout-date-gate.Tests.ps1' -PassThru
          if ($holdoutDateResult.FailedCount -gt 0 -or $holdoutDateResult.PassedCount -ne 5) {
            throw "Independent model holdout date tests failed: passed=$($holdoutDateResult.PassedCount), failed=$($holdoutDateResult.FailedCount)."
          }

          $credentialScanResult = Invoke-Pester -Path 'scripts/tests/tracked-credential-scan.Tests.ps1' -PassThru
          if ($credentialScanResult.FailedCount -gt 0 -or $credentialScanResult.PassedCount -ne 6) {
            throw "Tracked credential scan tests failed: passed=$($credentialScanResult.PassedCount), failed=$($credentialScanResult.FailedCount)."
          }
          & 'scripts/test-tracked-credentials.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Tracked KIS credential scan failed.' }

          $retiredKisApiResult = Invoke-Pester -Path 'scripts/tests/retired-kis-analysis-scan.Tests.ps1' -PassThru
          if ($retiredKisApiResult.FailedCount -gt 0 -or $retiredKisApiResult.PassedCount -ne 5) {
            throw "Retired KIS analysis API scan tests failed: passed=$($retiredKisApiResult.PassedCount), failed=$($retiredKisApiResult.FailedCount)."
          }
          & 'scripts/test-retired-kis-analysis.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Retired KIS analysis API runtime scan failed.' }

          $sessionResult = Invoke-Pester -Path 'scripts/tests/krx-session-monitor-domestic.Tests.ps1' -PassThru
          if ($sessionResult.FailedCount -gt 0 -or $sessionResult.PassedCount -ne 4) {
            throw "Domestic KRX session monitor tests failed: passed=$($sessionResult.PassedCount), failed=$($sessionResult.FailedCount)."
          }

          $monitorReportResult = Invoke-Pester -Path 'scripts/tests/domestic-session-monitor-report.Tests.ps1' -PassThru
          if ($monitorReportResult.FailedCount -gt 0 -or $monitorReportResult.PassedCount -ne 5) {
            throw "Domestic session monitor report tests failed: passed=$($monitorReportResult.PassedCount), failed=$($monitorReportResult.FailedCount)."
          }

          $modelSafetyResult = Invoke-Pester -Path 'scripts/tests/paper-safety.Tests.ps1' -PassThru
          if ($modelSafetyResult.FailedCount -gt 0 -or $modelSafetyResult.PassedCount -ne 4) {
            throw "Scheduled model safety tests failed: passed=$($modelSafetyResult.PassedCount), failed=$($modelSafetyResult.FailedCount)."
          }

          $dashboardTaskResult = Invoke-Pester -Path 'scripts/tests/dashboard-task.Tests.ps1' -PassThru
          if ($dashboardTaskResult.FailedCount -gt 0 -or $dashboardTaskResult.PassedCount -ne 7) {
            throw "Dashboard task safety tests failed: passed=$($dashboardTaskResult.PassedCount), failed=$($dashboardTaskResult.FailedCount)."
          }

      - name: Check local stack restart safety under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $postgresScripts = @(
            'scripts/lib/postgres-config.ps1',
            'scripts/lib/local-stack-activation.ps1',
            'scripts/configure-postgres-loopback.ps1',
            'scripts/test-postgres-loopback-config.ps1',
            'scripts/activate-local-stack.ps1',
            'scripts/test-local-stack-activation.ps1'
          )
          foreach ($postgresScript in $postgresScripts) {
            $postgresTokens = $null
            $postgresErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $postgresScript), [ref]$postgresTokens, [ref]$postgresErrors
            ) | Out-Null
            if ($postgresErrors.Count -gt 0) {
              $postgresErrors | ForEach-Object { Write-Error "$postgresScript`: $($_.Message)" }
            }
          }

          & 'scripts/test-postgres-loopback-config.ps1'
          $restartScript = 'scripts/restart-local-stack-task.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $restartScript), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error "$restartScript`: $($_.Message)" }
          }

          & 'scripts/test-local-stack-activation.ps1'
