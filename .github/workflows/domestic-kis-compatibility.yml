name: Domestic KIS API compatibility

on:
  push:
    branches: [develop]
    paths:
      - 'backend/trading-api/src/main/java/**'
      - 'backend/trading-api/src/main/resources/application.yml'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisRealDailyRiskBaselineServiceTest.java'
      - 'backend/trading-api/src/main/java/com/aistocktrader/kis/KisOrderIntentStore.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisOrderIntentStoreTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisOrderIntentPostgresIntegrationTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisRealExecutionNoticeClientTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisRealOrderReconciliationJobTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisPaperOrderReconciliationJobTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisRealProtectiveExitMonitorTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisRealOrderControllerTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/kis/KisOrderControllerMarketScopeTest.java'
      - 'backend/trading-api/src/test/java/com/aistocktrader/health/OperationsControllerTest.java'
      - 'services/market-ai/app/**'
      - 'scripts/export-daily-report.ps1'
      - 'scripts/lib/operations-report.ps1'
      - 'scripts/tests/domestic-only-operations-report.Tests.ps1'
      - 'scripts/tests/domestic-session-monitor-enabled-counts.Tests.ps1'
      - 'dashboard/src/app/api/operations/route.ts'
      - 'dashboard/src/app/page.tsx'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - 'scripts/lib/retired-kis-analysis-scan.ps1'
      - 'scripts/tests/retired-kis-analysis-scan.Tests.ps1'
      - '.github/workflows/domestic-kis-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domestic-kis-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check domestic KIS analysis API retirement guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'3.4.0' } | Select-Object -First 1
          if ($null -eq $pester) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force

          $result = Invoke-Pester -Path 'scripts/tests/retired-kis-analysis-scan.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -ne 5) {
            throw "Domestic KIS retirement scanner tests failed: passed=$($result.PassedCount), failed=$($result.FailedCount)."
          }

          . './scripts/lib/retired-kis-analysis-scan.ps1'
          $findings = @(Get-RetiredKisDomesticAnalysisFindings -RepositoryRoot (Get-Location).Path)
          if ($findings.Count -gt 0) {
            throw "Found $($findings.Count) retired KIS domestic analysis API reference(s) in runtime sources."
          }

          $result = Invoke-Pester -Path 'scripts/tests/domestic-only-operations-report.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -ne 1) {
            throw "Domestic-only operations report test failed: passed=$($result.PassedCount), failed=$($result.FailedCount)."
          }

          $result = Invoke-Pester -Path 'scripts/tests/domestic-session-monitor-enabled-counts.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -ne 1) {
            throw "Domestic session monitor enabled-count test failed: passed=$($result.PassedCount), failed=$($result.FailedCount)."
          }

  spring-domestic-operational-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_OPERATIONAL_SCOPE: KR
      KIS_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ORDERS_ENABLED: "false"
      KIS_REAL_RECONCILIATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/trading-api/pom.xml
      - name: Run domestic-only scheduled baseline scope test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisRealDailyRiskBaselineServiceTest#domesticOnlyScopeSkipsOutOfScopeScheduledBaselineBeforeExternalAccess test
      - name: Run KIS broker snapshot validation before order persistence
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisOrderIntentStoreTest test
      - name: Run domestic-only execution notice subscription scope test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisRealExecutionNoticeClientTest#domesticOperationalScopeSubscribesOnlyToDomesticExecutionNotices test
      - name: Run domestic-only scheduled reconciliation scope test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisRealOrderReconciliationJobTest#domesticOnlyScopeSkipsOutOfScopeOrdersBeforeBrokerReconciliation test
      - name: Run PAPER scheduled reconciliation safety tests
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisPaperOrderReconciliationJobTest test
      - name: Run PAPER read-only reconciliation preflight tests
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisOrderClientTest#domesticReconciliationMapsPartialFillFromBrokerHistory+paperReconciliationRequiresReadSwitchesAndNotTheOrderWriteSwitch test
      - name: Run domestic-only protective exit scope test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisRealProtectiveExitMonitorTest#domesticOnlyScopeSkipsOutOfScopeProtectiveExitBeforeSessionOrAccountAccess test
      - name: Run domestic-only PAPER order intent scope test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisOrderControllerMarketScopeTest#blocksOutOfScopePaperIntentReadReconciliationAndCancellationBeforeBrokerAccess test
      - name: Run domestic-only REAL order intent scope test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode -Dtest=KisRealOrderControllerTest#domesticScopeBlocksOutOfScopeRealIntentReadReconciliationAndCancellationBeforeBrokerAccess test
      - name: Run domestic-only operational market scope summary test
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=OperationsControllerTest#operationsSummaryReportsOnlyWhetherEnvironmentCredentialsAreConfigured+operationsSummaryMarksUnknownPaperOrderWithoutBrokerReferenceForManualReview' test

  spring-order-postgres-snapshot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_stock_trader_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_stock_trader_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/ai_stock_trader_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RUN_LOCAL_POSTGRES_INTEGRATION_TESTS: "true"
      KIS_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ORDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/trading-api/pom.xml
      - name: Verify contradictory broker snapshot remains locked in PostgreSQL
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#contradictoryBrokerSnapshotPersistsUnknownLockWithoutCreatingFillHistory' test
      - name: Verify PAPER reconciliation pages only domestic intents in PostgreSQL
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#paperReconciliationQueryPagesDomesticOrdersInStableUpdatedOrder' test
      - name: Verify PAPER reconciliation job polls KIS fills into PostgreSQL
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#paperReconciliationJobPollsKisDailyFillIntoPostgres' test
      - name: Verify PAPER cash settlement includes buy and sell costs in PostgreSQL
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#paperBuyAndSellPersistCostAdjustedCashPositionAndNetResult' test
      - name: Verify accepted PAPER KIS order intents recover after application restart
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#acceptedKisPaperIntentSurvivesSpringApplicationContextRestartWithoutResubmission' test
      - name: Verify ambiguous PAPER submissions stay locked after application restart
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#submittingPaperIntentRecoversAsUnknownAfterApplicationRestartWithoutBrokerResubmission' test
      - name: Verify stale KIS submissions recover to UNKNOWN in PostgreSQL
        working-directory: backend/trading-api
        run: bash ./mvnw --batch-mode '-Dtest=KisOrderIntentPostgresIntegrationTest#scheduledRecoveryMarksOnlyStaleSubmittingIntentsUnknown' test

  dashboard-domestic-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Lint domestic operations dashboard changes
        working-directory: dashboard
        run: npm run lint
      - name: Type-check dashboard
        working-directory: dashboard
        run: npx tsc --noEmit --incremental false
