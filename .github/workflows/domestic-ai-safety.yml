name: Domestic AI pipeline safety

on:
  push:
    branches: [develop]
    paths:
      - 'services/market-ai/app/ai_pipeline.py'
      - 'services/market-ai/app/data_provenance.py'
      - 'services/market-ai/app/main.py'
      - 'services/market-ai/app/market_scope.py'
      - 'services/market-ai/tests/test_ai_pipeline.py'
      - 'services/market-ai/tests/test_api.py'
      - 'services/market-ai/tests/test_data_provenance.py'
      - 'services/market-ai/tests/test_market_scope.py'
      - 'services/market-ai/scripts/validate_domestic_ai_pipeline_selection.py'
      - '.github/workflows/domestic-ai-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domestic-ai-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      PAPER_AUTOTRADING_ENABLED: "false"
      KIS_PAPER_ORDERS_ENABLED: "false"
      KIS_REAL_ORDERS_ENABLED: "false"
      KIS_ACCOUNT_READ_ENABLED: "false"
      KIS_PAPER_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ACCOUNT_READ_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/market-ai/pyproject.toml
      - name: Install AI pipeline test dependencies
        working-directory: services/market-ai
        run: python -m pip install -e ".[dev,ai,ops]"
      - name: Verify the selected test set is domestic only
        working-directory: services/market-ai
        run: python scripts/validate_domestic_ai_pipeline_selection.py
      - name: Run domestic AI pipeline tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q tests/test_ai_pipeline.py
          -k "not test_us_training_and_inference_accept_one_new_york_session_crossing_korea_midnight
          and not test_us_session_progress_uses_new_york_exchange_session
          and not test_model_prediction_rejects_market_scope_mismatch
          and not test_us_model_governance_is_scoped_to_us_symbol
          and not test_us_active_model_registry_selection_is_independent"
      - name: Run domestic training-readiness API tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_api.py::test_training_readiness_counts_only_complete_approved_websocket_sessions
          tests/test_api.py::test_kr_training_readiness_reports_incomplete_session_and_spread_reasons
      - name: Run domestic provenance training gate test only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_data_provenance.py::test_kr_model_training_rejects_missing_mixed_or_non_integer_source_counts
      - name: Verify domestic-only runtime operational scope
        working-directory: services/market-ai
        env:
          MARKET_OPERATIONAL_SCOPE: KR
        run: python -m pytest -q tests/test_market_scope.py
