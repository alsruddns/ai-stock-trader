name: Domestic AI pipeline safety

on:
  push:
    branches: [develop]
    paths:
      - 'services/market-ai/app/ai_pipeline.py'
      - 'services/market-ai/app/data_export.py'
      - 'services/market-ai/app/data_import.py'
      - 'services/market-ai/app/data_provenance.py'
      - 'services/market-ai/app/main.py'
      - 'services/market-ai/app/market_stream.py'
      - 'services/market-ai/app/market_scope.py'
      - 'services/market-ai/app/paper_runtime.py'
      - 'services/market-ai/app/quant.py'
      - 'services/market-ai/app/session_quality.py'
      - 'services/market-ai/app/snapshot_store.py'
      - 'services/market-ai/tests/test_ai_pipeline.py'
      - 'services/market-ai/tests/test_api.py'
      - 'services/market-ai/tests/test_data_export.py'
      - 'services/market-ai/tests/test_data_import.py'
      - 'services/market-ai/tests/test_data_provenance.py'
      - 'services/market-ai/tests/test_market_stream.py'
      - 'services/market-ai/tests/test_market_scope.py'
      - 'services/market-ai/tests/test_paper_runtime.py'
      - 'services/market-ai/tests/test_quant.py'
      - 'services/market-ai/tests/test_session_quality.py'
      - 'services/market-ai/tests/test_snapshot_store.py'
      - 'services/market-ai/tests/test_probe_kis_paper_cancel_preflight.py'
      - 'services/market-ai/scripts/validate_domestic_ai_pipeline_selection.py'
      - 'scripts/probe-kis-paper-cancel-preflight.py'
      - 'scripts/audit-market-session.py'
      - 'scripts/export-market-data.py'
      - 'backend/trading-api/src/main/resources/db/migration/V26__market_minute_bar_spread_observation_time.sql'
      - '.github/workflows/domestic-ai-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domestic-ai-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      PAPER_AUTOTRADING_ENABLED: "false"
      KIS_PAPER_ORDERS_ENABLED: "false"
      KIS_REAL_ORDERS_ENABLED: "false"
      KIS_ACCOUNT_READ_ENABLED: "false"
      KIS_PAPER_ACCOUNT_READ_ENABLED: "false"
      KIS_REAL_ACCOUNT_READ_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/market-ai/pyproject.toml
      - name: Install AI pipeline test dependencies
        working-directory: services/market-ai
        run: python -m pip install -e ".[dev,ai,ops]"
      - name: Run domestic PAPER cancel preflight probe tests (mocked)
        working-directory: services/market-ai
        run: python -m pytest -q tests/test_probe_kis_paper_cancel_preflight.py
      - name: Verify the selected test set is domestic only
        working-directory: services/market-ai
        run: python scripts/validate_domestic_ai_pipeline_selection.py
      - name: Run domestic AI pipeline tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q tests/test_ai_pipeline.py
          -k "not test_us_training_and_inference_accept_one_new_york_session_crossing_korea_midnight
          and not test_us_session_progress_uses_new_york_exchange_session
          and not test_model_prediction_rejects_market_scope_mismatch
          and not test_us_model_governance_is_scoped_to_us_symbol
          and not test_us_active_model_registry_selection_is_independent"
      - name: Run domestic training-readiness API tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_api.py::test_training_readiness_counts_only_complete_approved_websocket_sessions
          tests/test_api.py::test_kr_training_readiness_reports_incomplete_session_and_spread_reasons
      - name: Run domestic provenance training gate test only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_data_provenance.py::test_kr_model_training_rejects_missing_mixed_or_non_integer_source_counts
      - name: Run domestic minute-bar spread timestamp tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_quant.py::test_spread_observation_time_must_be_timezone_aware_and_within_bar_minute
          tests/test_market_stream.py::test_minute_aggregator_uses_same_minute_orderbook_quote_for_spread
          tests/test_market_stream.py::test_minute_aggregator_closes_prior_bar_before_later_minute_quote
          tests/test_snapshot_store.py::test_domestic_minute_bar_persistence_keeps_quote_observation_time
          tests/test_snapshot_store.py::test_domestic_session_restore_preserves_spread_observation_timestamp
          tests/test_session_quality.py::test_domestic_session_quality_counts_only_spreads_with_in_minute_observation_time
          tests/test_data_export.py::test_kr_session_coverage_reports_domestic_websocket_and_rest_source_counts
          tests/test_data_export.py::test_training_export_source_gate_requires_a_complete_spread_populated_kis_session
          tests/test_data_import.py::test_minute_bar_loader_groups_valid_timezone_aware_sessions
      - name: Verify domestic PAPER status preserves quote observation timestamps
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_api.py::test_paper_session_status_preserves_domestic_bar_quote_observation_time
      - name: Run domestic PAPER stream failure diagnostics tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_paper_runtime.py::test_domestic_websocket_failure_count_is_per_feed_and_keeps_only_safe_fields
          tests/test_paper_runtime.py::test_domestic_websocket_failure_count_ignores_unknown_feed_name
      - name: Run domestic final-minute persistence and shutdown tests only
        working-directory: services/market-ai
        run: >-
          python -m pytest -q
          tests/test_market_stream.py::test_minute_aggregator_closes_prior_bar_before_later_minute_quote
          tests/test_paper_runtime.py::test_domestic_new_minute_orderbook_closes_prior_bar_before_quote_overwrite
          tests/test_paper_runtime.py::test_domestic_consecutive_quote_before_trade_boundaries_preserve_each_bar_spread
          tests/test_paper_runtime.py::test_finalizer_persists_ended_domestic_minute_without_order_queue
          tests/test_paper_runtime.py::test_stop_waits_for_inflight_domestic_final_bar_storage
      - name: Verify domestic-only runtime operational scope
        working-directory: services/market-ai
        env:
          MARKET_OPERATIONAL_SCOPE: KR
        run: python -m pytest -q tests/test_market_scope.py
      - name: Verify domestic latest-closed session calendar API
        working-directory: services/market-ai
        run: python -m pytest -q tests/test_api.py::test_domestic_latest_closed_session_endpoint_returns_last_verified_session
      - name: Verify domestic scope locks WebSocket subscriptions before KIS access
        working-directory: services/market-ai
        env:
          MARKET_OPERATIONAL_SCOPE: KR
        run: python -m pytest -q tests/test_api.py::test_domestic_scope_rejects_non_domestic_websocket_before_kis_approval_key
      - name: Verify domestic scope blocks out-of-scope model governance changes
        working-directory: services/market-ai
        env:
          MARKET_OPERATIONAL_SCOPE: KR
        run: python -m pytest -q tests/test_api.py::test_domestic_scope_blocks_out_of_scope_model_governance_mutations
      - name: Verify PAPER monitor obeys domestic market scope
        working-directory: services/market-ai
        env:
          MARKET_OPERATIONAL_SCOPE: KR
        run: python -m pytest -q tests/test_paper_runtime.py::test_session_monitor_blocks_watchlist_outside_domestic_scope_before_opening_feeds
