[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-trader-market-ai"
version = "0.1.0"
description = "Read-only market analysis service; no broker or order access"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "uvicorn[standard]>=0.30,<1", "websockets>=13,<16"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]
ai = ["joblib>=1.4,<2", "lightgbm>=4.5,<5", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4"]
ops = ["exchange-calendars>=4.13.1,<5", "pandas>=2.3,<3.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
