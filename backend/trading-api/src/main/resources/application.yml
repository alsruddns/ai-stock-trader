server:
  port: ${SERVER_PORT:18080}
  address: 127.0.0.1
market-ai:
  base-url: ${MARKET_AI_BASE_URL:http://127.0.0.1:18000}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_stock_trader}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
trading:
  mode: ${TRADING_MODE:paper}
  live-trading-enabled: ${LIVE_TRADING_ENABLED:false}
  real-orders-enabled: ${KIS_REAL_ORDERS_ENABLED:false}
  real-protective-exit-manager-enabled: ${REAL_PROTECTIVE_EXIT_MANAGER_ENABLED:false}
  max-order-notional-krw: ${MAX_ORDER_NOTIONAL_KRW:1000000}
  max-order-notional-usd: ${MAX_ORDER_NOTIONAL_USD:100}
  live-risk:
    max-daily-loss-percent: ${LIVE_DAILY_LOSS_LIMIT_PCT:1.00}
    trade-risk-percent: ${LIVE_TRADE_RISK_EQUITY_PCT:0.25}
    max-position-percent: ${LIVE_MAX_POSITION_EQUITY_PCT:10.00}
    max-open-positions: ${LIVE_MAX_OPEN_POSITIONS:3}
    max-consecutive-losses: ${LIVE_MAX_CONSECUTIVE_LOSSES:3}
paper:
  automation-enabled: ${PAPER_AUTOTRADING_ENABLED:false}
  starting-cash-krw: ${PAPER_STARTING_CASH_KRW:0}
  starting-cash-usd: ${PAPER_STARTING_CASH_USD:0}
  order-timeout-seconds: ${PAPER_ORDER_TIMEOUT_SECONDS:0}
  costs:
    enabled: ${PAPER_COST_MODEL_ENABLED:false}
    kr-commission-bps: ${PAPER_KR_COMMISSION_BPS:0}
    kr-sell-cost-bps: ${PAPER_KR_SELL_COST_BPS:0}
    us-commission-bps: ${PAPER_US_COMMISSION_BPS:0}
    us-sell-cost-bps: ${PAPER_US_SELL_COST_BPS:0}
kis:
  orders:
    paper-enabled: ${KIS_PAPER_ORDERS_ENABLED:false}
  account-read-enabled: ${KIS_ACCOUNT_READ_ENABLED:false}
  paper-account-read-enabled: ${KIS_PAPER_ACCOUNT_READ_ENABLED:${KIS_ACCOUNT_READ_ENABLED:false}}
  real-account-read-enabled: ${KIS_REAL_ACCOUNT_READ_ENABLED:false}
  real-reconciliation-enabled: ${KIS_REAL_RECONCILIATION_ENABLED:false}
  real-reconciliation-delay-ms: ${KIS_REAL_RECONCILIATION_DELAY_MS:30000}
  real-protective-exit-automation-enabled: ${KIS_REAL_PROTECTIVE_EXIT_AUTOMATION_ENABLED:false}
  real-protective-exit-poll-ms: ${KIS_REAL_PROTECTIVE_EXIT_POLL_MS:1000}
  real-execution-notices-enabled: ${KIS_REAL_EXECUTION_NOTICES_ENABLED:false}
  real-hts-id: ${KIS_REAL_HTS_ID:}
  real-risk-baseline-poll-ms: ${KIS_REAL_RISK_BASELINE_POLL_MS:30000}
  snapshot-persistence-enabled: ${KIS_SNAPSHOT_PERSISTENCE_ENABLED:false}
  paper:
    app-key: ${KIS_PAPER_APP_KEY:}
    app-secret: ${KIS_PAPER_APP_SECRET:}
    account-number: ${KIS_PAPER_ACCOUNT_NUMBER:}
  real:
    app-key: ${KIS_REAL_APP_KEY:}
    app-secret: ${KIS_REAL_APP_SECRET:}
    account-number: ${KIS_REAL_ACCOUNT_NUMBER:}
  real-costs:
    kr-buy-commission-bps: ${KIS_REAL_KR_BUY_COMMISSION_BPS:}
    kr-sell-commission-bps: ${KIS_REAL_KR_SELL_COMMISSION_BPS:}
    kr-sell-tax-bps: ${KIS_REAL_KR_SELL_TAX_BPS:}
    us-buy-commission-bps: ${KIS_REAL_US_BUY_COMMISSION_BPS:}
    us-sell-commission-bps: ${KIS_REAL_US_SELL_COMMISSION_BPS:}
    us-sell-tax-bps: ${KIS_REAL_US_SELL_TAX_BPS:}
  connect-timeout: ${KIS_CONNECT_TIMEOUT:3s}
  read-timeout: ${KIS_READ_TIMEOUT:8s}
  min-request-interval: ${KIS_MIN_REQUEST_INTERVAL:1s}
