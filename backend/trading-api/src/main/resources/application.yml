server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_stock_trader}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
trading:
  mode: ${TRADING_MODE:paper}
  live-trading-enabled: ${LIVE_TRADING_ENABLED:false}
  real-orders-enabled: ${KIS_REAL_ORDERS_ENABLED:false}
  max-order-notional-krw: ${MAX_ORDER_NOTIONAL_KRW:1000000}
  max-order-notional-usd: ${MAX_ORDER_NOTIONAL_USD:100}
  live-risk:
    max-daily-loss-percent: ${LIVE_DAILY_LOSS_LIMIT_PCT:1.00}
    trade-risk-percent: ${LIVE_TRADE_RISK_EQUITY_PCT:0.25}
    max-position-percent: ${LIVE_MAX_POSITION_EQUITY_PCT:10.00}
    max-open-positions: ${LIVE_MAX_OPEN_POSITIONS:3}
    max-consecutive-losses: ${LIVE_MAX_CONSECUTIVE_LOSSES:3}
paper:
  starting-cash-krw: ${PAPER_STARTING_CASH_KRW:0}
  starting-cash-usd: ${PAPER_STARTING_CASH_USD:0}
  order-timeout-seconds: ${PAPER_ORDER_TIMEOUT_SECONDS:0}
kis:
  orders:
    paper-enabled: ${KIS_PAPER_ORDERS_ENABLED:false}
  account-read-enabled: ${KIS_ACCOUNT_READ_ENABLED:false}
  paper-account-read-enabled: ${KIS_PAPER_ACCOUNT_READ_ENABLED:${KIS_ACCOUNT_READ_ENABLED:false}}
  real-account-read-enabled: ${KIS_REAL_ACCOUNT_READ_ENABLED:false}
  snapshot-persistence-enabled: ${KIS_SNAPSHOT_PERSISTENCE_ENABLED:false}
  paper:
    app-key: ${KIS_PAPER_APP_KEY:}
    app-secret: ${KIS_PAPER_APP_SECRET:}
    account-number: ${KIS_PAPER_ACCOUNT_NUMBER:}
  real:
    app-key: ${KIS_REAL_APP_KEY:}
    app-secret: ${KIS_REAL_APP_SECRET:}
    account-number: ${KIS_REAL_ACCOUNT_NUMBER:}
  connect-timeout: ${KIS_CONNECT_TIMEOUT:3s}
  read-timeout: ${KIS_READ_TIMEOUT:8s}
  min-request-interval: ${KIS_MIN_REQUEST_INTERVAL:100ms}
